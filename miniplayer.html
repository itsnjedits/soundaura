<!DOCTYPE html>
<html lang="en" id="mp-html">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SoundAura</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text: #f0f6ff;
      --muted: rgba(240,246,255,0.55);
      --accent: #06b6d4;
      --accent2: #3b82f6;
      --hover: rgba(255,255,255,0.14);
      --bg-base: #060d1b;
    }
    html.light {
      --text: #0f172a;
      --muted: rgba(15,23,42,0.5);
      --accent: #0891b2;
      --accent2: #2563eb;
      --hover: rgba(0,0,0,0.1);
      --bg-base: #f0f5ff;
    }

    /* ─────────────────────────────────────────────────────────
       [FIX: Mini Player Layout]
       Lock html AND body to exactly 170×170.
       overflow:hidden prevents any content bleed.
       position:fixed on body ensures no scroll offset.
       ───────────────────────────────────────────────────────── */
    html {
      width:  170px !important;
      height: 170px !important;
      max-width:  170px !important;
      max-height: 170px !important;
      overflow: hidden !important;
    }
    body {
      width:  170px !important;
      height: 170px !important;
      max-width:  170px !important;
      max-height: 170px !important;
      overflow: hidden !important;
      background: var(--bg-base);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      /* Fixed so it can never be scrolled or resized by content */
      position: fixed;
      top: 0; left: 0;
    }

    /* ── Card fills the window exactly — no extra margin ───────── */
    #card {
      position: absolute;
      /* [FIX] inset:0 instead of top/left so it truly fills every pixel */
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Background art blur layer ──────────────────────────────── */
    #bg-art {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(10px) saturate(1.4);
      transform: scale(1.12); /* slightly overscale so blur edges don't show */
      opacity: 0.28;
      transition: background-image 0.6s ease, opacity 0.4s ease;
      pointer-events: none;
    }
    #bg-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(6,13,27,0.55) 0%,
        rgba(6,13,27,0.72) 100%
      );
      pointer-events: none;
    }
    html.light #bg-overlay {
      background: linear-gradient(180deg,
        rgba(240,245,255,0.55) 0%,
        rgba(240,245,255,0.72) 100%
      );
    }

    /* ─────────────────────────────────────────────────────────
       [FIX: Content Layout]
       - Removed side margins that were pushing text inward
       - Centered column with gap:4px between title/artist/controls
       - No wasted space: padding just enough to clear the close btn
       - cursor:grab enables drag without needing a separate handle
       ───────────────────────────────────────────────────────── */
    #content {
      position: relative;
      /* [FIX] Use inset:0 — fills exactly 170×170, no side gaps */
      inset: 0;
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* [FIX] Minimal padding: just 20px top (close btn) + 8px sides/bottom */
      padding: 20px 8px 8px;
      gap: 4px;
      cursor: grab;
    }
    #content:active { cursor: grabbing; }

    /* ── Close button — pinned top-right ────────────────────────── */
    #btn-close {
      position: absolute;
      top: 5px; right: 5px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: none; border: none;
      cursor: pointer;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      transition: color 0.12s, background 0.12s;
      flex-shrink: 0;
    }
    #btn-close:hover { color: var(--text); background: var(--hover); }

    /* ─────────────────────────────────────────────────────────
       [FIX: Song Title]
       - Width increased to 154px (170 - 2×8px padding) so text
         uses the full available width with no wasted side margin
       - margin-bottom removed — gap on #content handles spacing
       ───────────────────────────────────────────────────────── */
    #song-title {
      width: 154px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #song-title .inner { display: inline-block; padding: 0 2px; }

    /* Marquee — scrolls text that is wider than the title container */
    @keyframes marquee {
      0%,  15% { transform: translateX(0); }
      85%, 100% { transform: translateX(var(--md, 0px)); }
    }
    #song-title.scrolling .inner {
      animation: marquee 6s ease-in-out infinite alternate;
    }
    #song-title.scrolling:hover .inner { animation-play-state: paused; }

    /* ─────────────────────────────────────────────────────────
       [FIX: Artist]
       - Width matches title (154px) — full usable width
       - margin-bottom removed — gap handles spacing cleanly
       ───────────────────────────────────────────────────────── */
    #song-artist {
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      width: 154px;
      flex-shrink: 0;
    }

    /* ── Controls row ──────────────────────────────────────────── */
    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: center;
      /* [FIX] Slightly tighter gap — keeps controls compact */
      gap: 8px;
      flex-shrink: 0;
      /* [FIX] Small top margin to separate controls from artist text */
      margin-top: 6px;
    }

    /* ── Base button reset ─────────────────────────────────────── */
    button {
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      transition: background 0.12s, transform 0.07s, color 0.12s;
      outline: none;
      flex-shrink: 0;
    }

    /* ── Prev / Next ────────────────────────────────────────────── */
    .ctrl-btn {
      width: 26px; height: 26px;
      color: rgba(255,255,255,0.7);
    }
    html.light .ctrl-btn { color: rgba(15,23,42,0.7); }
    .ctrl-btn:hover { background: var(--hover); color: var(--text); }
    .ctrl-btn:active { transform: scale(0.85); }

    /* ── Play / Pause ───────────────────────────────────────────── */
    #btn-play {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      box-shadow: 0 0 14px rgba(6,182,212,0.45);
      transition: filter 0.12s, transform 0.07s, box-shadow 0.15s;
    }
    #btn-play:hover {
      filter: brightness(1.18);
      box-shadow: 0 0 20px rgba(6,182,212,0.65);
    }
    #btn-play:active { transform: scale(0.88); }
    #btn-play.playing { animation: playGlow 2.2s ease-in-out infinite; }
    @keyframes playGlow {
      0%,100% { box-shadow: 0 0 8px  rgba(6,182,212,0.28); }
      50%     { box-shadow: 0 0 22px rgba(6,182,212,0.70); }
    }

    /* ── Progress strip — pinned to bottom edge ─────────────────── */
    #prog-strip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
    }
    #prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      transition: width 0.15s linear;
    }

    /* ── BroadcastChannel not supported fallback ────────────────── */
    #no-bc {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* [FIX] Match exact window dimensions */
      width: 170px; height: 170px;
      padding: 14px;
      text-align: center;
      gap: 6px;
      background: var(--bg-base);
    }
    #no-bc p { font-size: 10px; color: var(--muted); line-height: 1.45; }
  </style>
</head>
<body>

<div id="card">
  <div id="bg-art"></div>
  <div id="bg-overlay"></div>

  <div id="content">
    <!-- Close button — positioned absolute so it doesn't affect flex layout -->
    <button id="btn-close" title="Close (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" width="10" height="10">
        <line x1="18" y1="6"  x2="6"  y2="18"/>
        <line x1="6"  y1="6"  x2="18" y2="18"/>
      </svg>
    </button>

    <!-- Title -->
    <div id="song-title"><span class="inner">No song playing</span></div>

    <!-- Artist -->
    <div id="song-artist">–</div>

    <!-- Controls -->
    <div class="ctrl-row">
      <button id="btn-prev" class="ctrl-btn" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
          <polygon points="19,20 9,12 19,4"/>
          <rect x="4" y="4" width="3" height="16" rx="1.5"/>
        </svg>
      </button>

      <button id="btn-play" title="Play / Pause">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </button>

      <button id="btn-next" class="ctrl-btn" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
          <polygon points="5,4 15,12 5,20"/>
          <rect x="17" y="4" width="3" height="16" rx="1.5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Progress strip at very bottom -->
  <div id="prog-strip"><div id="prog-fill"></div></div>
</div>

<!-- Fallback when BroadcastChannel isn't available -->
<div id="no-bc">
  <p>BroadcastChannel not supported.<br>Use Chrome 54+ / Firefox 38+ / Edge 79+.</p>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────
// [FIX: Mini Player Window Lock]
// window.open is called with resizable=no but some OS/browsers
// still allow expanding.  We enforce the size on every mouse move
// (via window.resizeTo inside the drag handler) and also on a
// periodic timer as a safety net.
// ─────────────────────────────────────────────────────────────
const WIN_W = 170, WIN_H = 170;

const PAUSE_SVG = `<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
  <rect x="6"  y="4" width="4" height="16"/>
  <rect x="14" y="4" width="4" height="16"/>
</svg>`;
const PLAY_SVG = `<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
  <polygon points="5,3 19,12 5,21"/>
</svg>`;

const $ = id => document.getElementById(id);

// ── Hard-lock window size ────────────────────────────────────
function lockSize() {
  if (window.outerWidth !== WIN_W || window.outerHeight !== WIN_H) {
    try { window.resizeTo(WIN_W, WIN_H); } catch (_) {}
  }
}
lockSize();
// [FIX] Re-lock every 1 s (was 2 s) — catch any OS-level resize faster
setInterval(lockSize, 1000);

// ── Marquee scrolling for long titles ───────────────────────
let _lastTitle = '';
function applyMarquee() {
  const wrap  = $('song-title');
  const inner = wrap?.querySelector('.inner');
  if (!inner) return;
  wrap.classList.remove('scrolling');
  inner.style.animation = 'none';
  void inner.offsetWidth; // force reflow
  // [FIX] Compare against 154 (full usable width after padding)
  const overflow = inner.scrollWidth - 154;
  if (overflow > 4) {
    inner.style.setProperty('--md', `-${overflow + 6}px`);
    inner.style.animation = '';
    wrap.classList.add('scrolling');
  }
}

// ─────────────────────────────────────────────────────────────
// [FIX: Drag — re-lock size on EVERY move event]
// Some browsers expand the window when its position is updated.
// Calling resizeTo() after every moveTo() clamps it back.
// ─────────────────────────────────────────────────────────────
let _dragging = false, _ox = 0, _oy = 0;

$('content').addEventListener('mousedown', e => {
  if (e.target.closest('button')) return; // don't drag when clicking controls
  _dragging = true;
  _ox = e.screenX - window.screenX;
  _oy = e.screenY - window.screenY;
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!_dragging) return;
  try {
    window.moveTo(e.screenX - _ox, e.screenY - _oy);
    // [FIX] Always clamp size immediately after moving — prevents expansion
    window.resizeTo(WIN_W, WIN_H);
  } catch (_) {}
});

document.addEventListener('mouseup', () => {
  if (_dragging) {
    _dragging = false;
    // Final size clamp on release
    try { window.resizeTo(WIN_W, WIN_H); } catch (_) {}
  }
});

// ── BroadcastChannel setup ────────────────────────────────────
if (!('BroadcastChannel' in window)) {
  // Show the "not supported" fallback
  $('card').style.display  = 'none';
  $('no-bc').style.display = 'flex';
} else {
  const bc = new BroadcastChannel('soundaura_player');

  bc.onmessage = ({ data: d }) => {
    if (d.type !== 'STATE') return;

    // Sync theme
    document.getElementById('mp-html').className = d.isDark ? '' : 'light';

    // Blurred background art
    if (d.thumb) {
      $('bg-art').style.backgroundImage = `url('${d.thumb}')`;
      $('bg-art').style.opacity = '0.28';
    } else {
      $('bg-art').style.opacity = '0';
    }

    // Song title — only update + re-compute marquee when changed
    const newTitle = d.title || 'No song playing';
    if (newTitle !== _lastTitle) {
      _lastTitle = newTitle;
      const inner = $('song-title')?.querySelector('.inner');
      if (inner) inner.textContent = newTitle;
      document.title = newTitle;
      requestAnimationFrame(applyMarquee);
    }

    // Artist
    $('song-artist').textContent = d.artist || '–';

    // Play/pause state
    $('btn-play').innerHTML = d.playing ? PAUSE_SVG : PLAY_SVG;
    $('btn-play').classList.toggle('playing', d.playing);

    // Progress bar
    $('prog-fill').style.width = (d.progress || 0) + '%';
  };

  // ── Control buttons → send commands back to main window ──────
  $('btn-play').addEventListener('click', () => bc.postMessage({ type: 'CMD_PLAY' }));
  $('btn-prev').addEventListener('click', () => bc.postMessage({ type: 'CMD_PREV' }));
  $('btn-next').addEventListener('click', () => bc.postMessage({ type: 'CMD_NEXT' }));
  $('btn-close').addEventListener('click', () => {
    bc.postMessage({ type: 'POPUP_CLOSED' });
    bc.close();
    window.close();
  });

  // ── Keyboard shortcuts ────────────────────────────────────────
  document.addEventListener('keydown', e => {
    switch (e.code) {
      case 'Space':
        e.preventDefault();
        bc.postMessage({ type: 'CMD_PLAY' });
        break;
      case 'ArrowLeft':
        bc.postMessage({ type: 'CMD_PREV' });
        break;
      case 'ArrowRight':
        bc.postMessage({ type: 'CMD_NEXT' });
        break;
      case 'Escape':
        bc.postMessage({ type: 'POPUP_CLOSED' });
        bc.close();
        window.close();
        break;
    }
  });

  // Tell main window we're ready — it will immediately broadcast STATE
  bc.postMessage({ type: 'POPUP_READY' });

  // ── Stale-connection detection ────────────────────────────────
  // If no STATE message arrives within 8 s, the main window is
  // probably closed — show a "waiting" indicator.
  let _deadTimer = setTimeout(() => {
    const inner = $('song-title')?.querySelector('.inner');
    if (inner) inner.textContent = 'Waiting for SoundAura…';
    $('song-artist').textContent = 'Keep the main window open';
    $('bg-art').style.opacity = '0';
    _lastTitle = '';
    applyMarquee();
  }, 8000);

  // Reset the timer every time a message arrives
  bc.addEventListener('message', () => {
    clearTimeout(_deadTimer);
    // Re-arm — if main window closes mid-session we still detect it
    _deadTimer = setTimeout(() => {
      const inner = $('song-title')?.querySelector('.inner');
      if (inner) inner.textContent = 'Waiting for SoundAura…';
      $('song-artist').textContent = 'Keep the main window open';
      $('bg-art').style.opacity = '0';
      _lastTitle = '';
      applyMarquee();
    }, 8000);
  });
}
</script>
</body>
</html>

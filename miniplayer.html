<!DOCTYPE html>
<html lang="en" id="mp-html">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SoundAura</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060d1b; --text: #f0f6ff; --muted: #6b7fa0;
      --accent: #06b6d4; --accent2: #3b82f6;
      --border: rgba(255,255,255,0.1); --hover: rgba(255,255,255,0.12);
    }
    html.light {
      --bg: #f0f5ff; --text: #0f172a; --muted: #475569;
      --accent: #0891b2; --accent2: #2563eb;
      --border: rgba(0,0,0,0.1); --hover: rgba(0,0,0,0.08);
    }

    html, body {
      width: 200px; height: 200px; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none; -webkit-user-select: none;
    }

    /* Drag handle: full card is draggable */
    body { cursor: grab; }
    body:active { cursor: grabbing; }

    #card {
      width: 200px; height: 200px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
      padding: 0 14px;
      position: relative;
      /* Glass border */
      border: 1px solid rgba(6,182,212,0.22);
      border-radius: 0;
      background: var(--bg);
      /* Subtle glow */
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* Close button — top right corner */
    #btn-close {
      position: absolute; top: 7px; right: 7px;
      width: 20px; height: 20px; border-radius: 50%;
      background: none; border: none; cursor: pointer;
      color: var(--muted); display: flex; align-items: center; justify-content: center;
      transition: color 0.12s, background 0.12s;
    }
    #btn-close:hover { color: var(--text); background: var(--hover); }

    /* Song title — marquee scrolling if too long */
    #song-title {
      width: 100%; text-align: center;
      font-size: 13px; font-weight: 700; color: var(--text);
      overflow: hidden; white-space: nowrap;
      margin-bottom: 4px;
    }
    #song-title .inner {
      display: inline-block;
      /* marquee animation applied by JS when text overflows */
    }
    @keyframes marquee {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(0); }
      80%  { transform: translateX(var(--marquee-dist, -50%)); }
      100% { transform: translateX(var(--marquee-dist, -50%)); }
    }
    #song-title.scrolling .inner {
      animation: marquee 5s linear infinite;
    }

    /* Artist */
    #song-artist {
      font-size: 10px; color: var(--muted); text-align: center;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      width: 100%; margin-bottom: 16px;
    }

    /* Controls row */
    .ctrl-row {
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }

    button { background: none; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; transition: background 0.12s, transform 0.08s; outline: none; }

    .ctrl-btn { width: 30px; height: 30px; color: rgba(255,255,255,0.65); }
    html.light .ctrl-btn { color: #334155; }
    .ctrl-btn:hover { background: var(--hover); color: var(--text); }
    .ctrl-btn:active { transform: scale(0.85); }

    #btn-play {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white; box-shadow: 0 0 14px rgba(6,182,212,0.4);
      transition: filter 0.12s, transform 0.08s, box-shadow 0.15s;
    }
    #btn-play:hover { filter: brightness(1.15); box-shadow: 0 0 22px rgba(6,182,212,0.6); }
    #btn-play:active { transform: scale(0.88); }
    #btn-play.playing {
      animation: playGlow 2.2s ease-in-out infinite;
    }
    @keyframes playGlow {
      0%,100% { box-shadow: 0 0 10px rgba(6,182,212,0.28); }
      50%      { box-shadow: 0 0 24px rgba(6,182,212,0.7); }
    }

    /* Progress strip — thin line at very bottom */
    #prog-strip {
      position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
      background: rgba(255,255,255,0.06);
    }
    #prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%; transition: width 0.15s linear;
    }

    /* Fallback: no BroadcastChannel */
    #no-bc { display: none; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; padding: 14px; text-align: center; gap: 6px; }
    #no-bc p { font-size: 10px; color: var(--muted); line-height: 1.45; }
  </style>
</head>
<body>
<div id="card">
  <!-- Close -->
  <button id="btn-close" title="Close (Esc)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <!-- Title -->
  <div id="song-title"><span class="inner">No song playing</span></div>

  <!-- Artist -->
  <div id="song-artist">–</div>

  <!-- Controls: Prev · Play/Pause · Next -->
  <div class="ctrl-row">
    <button id="btn-prev" class="ctrl-btn" title="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
        <polygon points="19,20 9,12 19,4"/><rect x="4" y="4" width="3" height="16" rx="1.5"/>
      </svg>
    </button>
    <button id="btn-play" title="Play / Pause">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><polygon points="5,3 19,12 5,21"/></svg>
    </button>
    <button id="btn-next" class="ctrl-btn" title="Next">
      <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
        <polygon points="5,4 15,12 5,20"/><rect x="17" y="4" width="3" height="16" rx="1.5"/>
      </svg>
    </button>
  </div>

  <!-- Progress strip -->
  <div id="prog-strip"><div id="prog-fill"></div></div>
</div>

<div id="no-bc"><p>BroadcastChannel unsupported.<br>Use Chrome 54+ / Firefox 38+ / Edge 79+.</p></div>

<script>
'use strict';
const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
const PLAY_SVG  = '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><polygon points="5,3 19,12 5,21"/></svg>';
const $ = id => document.getElementById(id);

// Marquee: if title text is wider than container, apply scrolling
function applyMarquee() {
  const wrap = $('song-title');
  const inner = wrap.querySelector('.inner');
  if (!inner) return;
  wrap.classList.remove('scrolling');
  inner.style.animation = 'none';
  // Measure
  const containerW = wrap.offsetWidth;
  const textW = inner.scrollWidth;
  if (textW > containerW + 4) {
    // Set CSS variable for how far to scroll
    const dist = -(textW - containerW + 10);
    inner.style.setProperty('--marquee-dist', dist + 'px');
    void inner.offsetWidth; // reflow
    inner.style.animation = '';
    wrap.classList.add('scrolling');
  }
}

// Drag the window
let dragging = false, ox = 0, oy = 0;
document.addEventListener('mousedown', e => {
  if (e.target.closest('button')) return;
  dragging = true; ox = e.screenX - window.screenX; oy = e.screenY - window.screenY;
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  window.moveTo(e.screenX - ox, e.screenY - oy);
});
document.addEventListener('mouseup', () => { dragging = false; });

if (!('BroadcastChannel' in window)) {
  $('card').style.display = 'none';
  $('no-bc').style.display = 'flex';
} else {
  const bc = new BroadcastChannel('soundaura_player');

  bc.onmessage = e => {
    const d = e.data;
    if (d.type !== 'STATE') return;
    document.getElementById('mp-html').className = d.isDark ? '' : 'light';

    // Title with marquee
    const titleInner = $('song-title').querySelector('.inner');
    if (titleInner) titleInner.textContent = d.title || 'No song playing';
    document.title = (d.title || 'SoundAura');
    requestAnimationFrame(applyMarquee);

    $('song-artist').textContent = d.artist || '–';

    $('btn-play').innerHTML = d.playing ? PAUSE_SVG : PLAY_SVG;
    $('btn-play').classList.toggle('playing', d.playing);

    // Thin progress strip
    $('prog-fill').style.width = (d.progress || 0) + '%';
  };

  $('btn-play').addEventListener('click', () => bc.postMessage({ type: 'CMD_PLAY' }));
  $('btn-prev').addEventListener('click', () => bc.postMessage({ type: 'CMD_PREV' }));
  $('btn-next').addEventListener('click', () => bc.postMessage({ type: 'CMD_NEXT' }));
  $('btn-close').addEventListener('click', () => {
    bc.postMessage({ type: 'POPUP_CLOSED' }); bc.close(); window.close();
  });

  document.addEventListener('keydown', e => {
    if (e.code === 'Space')      { e.preventDefault(); bc.postMessage({ type: 'CMD_PLAY' }); }
    else if (e.code === 'ArrowLeft')  bc.postMessage({ type: 'CMD_PREV' });
    else if (e.code === 'ArrowRight') bc.postMessage({ type: 'CMD_NEXT' });
    else if (e.code === 'Escape')   { bc.postMessage({ type: 'POPUP_CLOSED' }); bc.close(); window.close(); }
  });

  bc.postMessage({ type: 'POPUP_READY' });

  // Disconnect detection
  let dead = setTimeout(() => {
    $('song-title').querySelector('.inner').textContent = 'Waiting…';
    $('song-artist').textContent = 'Open SoundAura';
    document.title = 'SoundAura';
  }, 8000);
  bc.addEventListener('message', () => { clearTimeout(dead); dead = setTimeout(() => {}, 8000); });
}
</script>
</body>
</html>
